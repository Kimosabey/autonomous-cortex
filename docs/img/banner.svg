<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Autonomous-Cortex — Mission Console">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="amber" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(217,119,6,0.35)"/>
      <stop offset="100%" stop-color="rgba(217,119,6,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- Amber radial -->
  <rect width="1200" height="320" fill="url(#amber)" opacity="0.6"/>
  <!-- Grid -->
  <g stroke="rgba(15,23,42,0.05)" stroke-width="1">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>
  <!-- Radar -->
  <g transform="translate(170 160)">
    <circle r="120" fill="none" stroke="#0f172a" stroke-width="0.7" opacity="0.4"/>
    <circle r="90"  fill="none" stroke="#0f172a" stroke-width="0.5" opacity="0.4"/>
    <circle r="60"  fill="none" stroke="#0f172a" stroke-width="0.5" opacity="0.4"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#0f172a" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#0f172a" stroke-width="0.5" opacity="0.4"/>
    <!-- Sweep wedge -->
    <path d="M0 0 L0 -118 A118 118 0 0 1 86 -82 Z" fill="#d97706" opacity="0.35"/>
    <!-- Ping dot -->
    <circle cx="62" cy="-58" r="5" fill="#d97706"/>
    <circle cx="62" cy="-58" r="11" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Status LED row -->
  <g transform="translate(1040 38)" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700">
    <text fill="#334155" letter-spacing="3">OPS</text>
    <circle cx="44" cy="-4" r="5" fill="#16a34a"/>
    <circle cx="64" cy="-4" r="5" fill="#d97706"/>
    <circle cx="84" cy="-4" r="5" fill="#dc2626"/>
  </g>
  <!-- Dashed amber accent -->
  <g transform="translate(320 60)">
    <rect width="0" height="0"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#d97706" stroke-width="3" stroke-dasharray="12 8"/>
  </g>
  <!-- Brand -->
  <g transform="translate(320 110)">
    <text font-family="JetBrains Mono,monospace" font-size="13" font-weight="700" fill="#b45309" letter-spacing="6">SELFAWARE — CORTEX IV</text>
    <text y="74" font-family="Manrope,sans-serif" font-size="78" font-weight="800" fill="#0f172a" letter-spacing="-2">Mission Console</text>
    <text y="120" font-family="Inter,sans-serif" font-size="22" fill="#334155">Agentic investigation · live SSE · ReAct loop</text>
    <text y="156" font-family="JetBrains Mono,monospace" font-size="14" fill="#b45309" letter-spacing="2">:8104  ·  NeuralPulse + SpatialNexus  ·  Ollama  ·  WCAG-AA</text>
  </g>
</svg>
